<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinión sobre la IA - Formulario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Tu Opinión Importa</h1>
        <p>Comparte tu perspectiva sobre el impacto de la IA</p>
        
        <nav aria-label="Navegación principal">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="formulario.html">Encuesta</a></li>
            <li><a href="noticias.html">Noticias</a></li>
        </ul>
    </nav>
    </header>

    <main>
        <section>
            <h2>Formulario de Registro</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="percepcion">¿Cómo ves el futuro de la IA?</label>
                    <select id="percepcion" name="percepcion" required>
                        <option value="">Selecciona una opción</option>
                        <option value="positivo">Muy Positivo (Traerá progreso)</option>
                        <option value="neutral">Neutral (Tiene pros y contras)</option>
                        <option value="negativo">Preocupante (Riesgo para el empleo/privacidad)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios o dudas adicionales:</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escribe aquí lo que piensas..."></textarea>
                </div>

                <button type="submit">Enviar Opinión</button>
            </form>
            
            <a href="index.html" class="btn-volver">← Volver a la página de inicio</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - El Impacto de la Inteligencia Artificial</p>
    </footer>

</body>
</html>
