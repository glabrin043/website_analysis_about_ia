<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinión sobre la IA - Formulario</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            padding: 2.5rem 1rem;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        main {
            max-width: 600px; /* Más angosto para formularios */
            margin: 2rem auto;
            padding: 0 1rem;
        }
        section {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1e3c72;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 0.5rem;
        }
        
        /* Estilos específicos del formulario */
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #1e3c72;
        }
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 5px rgba(42, 82, 152, 0.3);
        }
        button {
            background: #1e3c72;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #2a5298;
        }
        .btn-volver {
            display: inline-block;
            margin-top: 1rem;
            color: #1e3c72;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-volver:hover {
            text-decoration: underline;
        }
        
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #222;
            color: white;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tu Opinión Importa</h1>
        <p>Comparte tu perspectiva sobre el impacto de la IA</p>
    </header>

    <main>
        <section>
            <h2>Formulario de Registro</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="percepcion">¿Cómo ves el futuro de la IA?</label>
                    <select id="percepcion" name="percepcion" required>
                        <option value="">Selecciona una opción</option>
                        <option value="positivo">Muy Positivo (Traerá progreso)</option>
                        <option value="neutral">Neutral (Tiene pros y contras)</option>
                        <option value="negativo">Preocupante (Riesgo para el empleo/privacidad)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios o dudas adicionales:</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escribe aquí lo que piensas..."></textarea>
                </div>

                <button type="submit">Enviar Opinión</button>
            </form>
            
            <a href="index.html" class="btn-volver">← Volver a la página de inicio</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - El Impacto de la Inteligencia Artificial</p>
    </footer>

</body>
</html>
